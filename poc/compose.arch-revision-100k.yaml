    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:11380"
      NCHAN_SUB_URL: "http://host.docker.internal:11381"
      NCHAN_CONTROL_URL: "http://host.docker.internal:11388"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "3"
    deploy: { resources: { limits: { cpus: "5", memory: 4G } } }
    cpu_shares: 262144
    ulimits: { nofile: { soft: 120000, hard: 120000 } }

networks:
  shard-net:
    driver: bridge
    ipam: { config: [{ subnet: 172.28.0.0/16 }] }
volumes:
  global-evidence:
  redis-cgroup-evidence:

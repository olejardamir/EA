# ARCHITECTURE REVISION — match-aware horizontal fan-out (post-M3).
#
# > This is a post-M3 architecture revision. It does not alter or supersede
# > the frozen v2.3.0 M3 evidence. It retains the original workload and
# > performance gates while allowing topology changes in response to M3's
# > falsified architecture assumption.
#
# Topology: 8 matches x 2 fan-out shards = 16 independent Nchan instances,
# each 1 worker (same total worker count as the frozen 4×4), ~6,250 viewers
# per shard at 100k. Each (match, shard) owns its viewers; events are
# published only to the two shards that own the match. Redis removed from
# the delivery hot path (local in-memory storage per shard).
#
# F1 improvements preserved: NGINX_DEBUG=0, LIVELOCK_WATCHER=0, Redis
# io-threads-do-reads. No regressing knobs reintroduced.
#
# Port scheme (instance k = m*2 + s, 0..15):
#   fanout-{m}{a|b}: pub 11080+k*100, sub 11081+k*100, ctrl 11088+k*100

x-nonblocking-logging: &nonblocking-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m

services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--io-threads", "4", "--io-threads-do-reads", "yes"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
      - redis-cgroup-evidence:/redis-cgroup
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    cpu_shares: 262144
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fanout-0a:
    build: { context: ./nchan, network: host, args: { NGINX_DEBUG: "${NGINX_DEBUG:-0}" } }
    network_mode: host
    depends_on: { redis: { condition: service_healthy } }
    environment: { NGINX_CONF: "/etc/nginx/fanout-0a.conf", CONTROL_PORT: "11088", NGINX_STATUS_PORT: "11080", MIN_CPU_QUOTA: "1", LIVELOCK_WATCHER: "0" }
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    cpu_shares: 262144
    logging: *nonblocking-logging
    cap_add: [SYS_PTRACE]
    ulimits: { nofile: { soft: 200000, hard: 200000 } }
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:11080/pub/healthcheck"], interval: 5s, timeout: 3s, retries: 10 }
  fanout-0b:
    build: { context: ./nchan, network: host, args: { NGINX_DEBUG: "${NGINX_DEBUG:-0}" } }

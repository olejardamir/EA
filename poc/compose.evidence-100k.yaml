# §3.2: Multi-shard 100k generator topology
# 4 runner shards on a Docker bridge network, each with distinct source IP.
# Per-shard allocation: 25,000 connections (safe within typical 28,232-port range).
# Aggregate: 4 × 25,000 = 100,000 = target (exact match, no excess port pressure).
# Frozen proof: 25,000 viewers + 2,500 reconnect/TIME_WAIT + 64 non-viewer
# sockets + 512 safety = 28,076 required, leaving 156 ports of headroom.
# Nchan and Redis remain on host networking for stability.
# Runners reach host-network services via host.docker.internal.
# Launch with ./run-evidence-100k.sh; it injects the checkout SHA automatically.

services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    command: ["redis-server"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
      - redis-cgroup-evidence:/redis-cgroup
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CONTROL_PORT: "18888"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-2:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-2.conf"
      CONTROL_PORT: "18889"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    command: ["npm", "run", "start:coordinator"]
    networks:
      - shard-net
    environment:
      SHARD_TOTAL: "4"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      EXPERIMENT_RUN_ID: "${EXPERIMENT_RUN_ID:?Use ./run-evidence-100k.sh}"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_RESULT_PATH: "${GLOBAL_RESULT_PATH:-/evidence/global-result-0.json}"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      COORDINATOR_MAX_RUN_MS: "2100000"
    volumes:
      - global-evidence:/evidence
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # §3.2: 4 runner shards on a shared bridge network.
  # Each container gets a unique Docker-assigned IP on the bridge subnet.
  # Each shard connects to Nchan via host.docker.internal (host-network gateway).
  # Per-shard capacity: 25,000 connections (safe within ~28k ephemeral range).
  # Aggregate: 4 × 25,000 = 100,000 = target.

  runner-shard-0:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    depends_on:
      nchan:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NCHAN_PUB_URL: "http://host.docker.internal:8080"
      NCHAN_SUB_URL: "http://host.docker.internal:8081"
      NCHAN2_SUB_URL: "http://host.docker.internal:18081"
      NCHAN2_PUB_URL: "http://host.docker.internal:18080"
      NCHAN_CONTROL_URL: "http://host.docker.internal:18888"
      REDIS_URL: "redis://host.docker.internal:6379"
      TARGET_CONNECTIONS: "25000"
      WARMUP_SECONDS: "30"
      MEASURE_SECONDS: "120"
      BURST_SECONDS: "30"
      SURGE_SECONDS: "120"
      COOLDOWN_SECONDS: "10"
      SLOW_CONSUMER_FRACTION: "0.05"
      RUN_PROFILE: "evidence"
      RUN_MODE: "coordinated-shard"
      COORDINATOR_URL: "http://coordinator:3000"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      GLOBAL_RUN_INDEX: "${GLOBAL_RUN_INDEX:-0}"
      SEED: "${GLOBAL_SEED:-42}"
      PUBLISHER_OWNER: "true"
      SHARD_ID: "0"
      SHARD_TOTAL: "4"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      # §BS hang-safety ceiling for the coordinated 100k profile: generous, never
      # fires in a valid run; prevents valid phase overruns from destroying evidence
      RUNNER_MAX_RUN_MS: "1800000"
      NCHAN_CPU_MAX_QUOTA: "400000"
      NCHAN_CPU_MAX_PERIOD: "100000"
      REDIS_CPU_MAX_QUOTA: "200000"
      REDIS_CPU_MAX_PERIOD: "100000"
      NCHAN_MEMORY_GB: "8"
      NCHAN_NOFILE_SOFT: "200000"
      NCHAN_NOFILE_HARD: "200000"
      NCHAN2_CPU_MAX_QUOTA: "400000"
      NCHAN2_CPU_MAX_PERIOD: "100000"
      NCHAN2_MEMORY_GB: "4"
      NCHAN2_NOFILE_SOFT: "200000"
      NCHAN2_NOFILE_HARD: "200000"
      REDIS_MEMORY_GB: "2"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  runner-shard-1:

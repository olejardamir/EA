# §M3-R: Horizontally partitioned 100k fan-out topology (contract v2.1.0).
#
# Architecture (Terminal A executed): four independent Nchan partition nodes,
# each serving ~25,000 viewers of the 100,000-viewer global target, plus one
# spare replacement node. All nodes share one canonical Redis store, so an
# event published exactly once by the publisher-owner via partition p0 is
# replicated to every node: live delivery, Last-Event-ID exact-range resume,
# and full-history replay work identically on any node (probe-verified).
#
# Port allocation (all host networking):
#   node          pub     sub     control
#   nchan-p0      8080    8081    18888
#   nchan-p1      18080   18081   18889
#   nchan-p2      28080   28081   28888
#   nchan-p3      38080   38081   38889
#   nchan-spare   48080   48081   48888
#
# Generator shards: 4 runner shards on a Docker bridge network, each with a
# distinct source IP. Shard i owns partition i: its viewers connect to that
# partition's subscriber port and its resource monitor polls that node.
# Per-shard allocation: 25,000 connections (safe within typical 28,232-port
# range). Frozen proof: 25,000 viewers + 2,500 reconnect/TIME_WAIT + 64
# non-viewer sockets + 512 safety = 28,076 required, leaving 156 ports of
# headroom per shard.
#
# Host-reality note (§9): configured CPU quotas intentionally exceed the
# physical core count (documented oversubscription); quotas cap per-service
# usage so CFS shares fairly. Real expected peak demand is approximately half
# the quota sum. Dev probes validate latency gates under this sharing before
# any qualifying campaign.
#
# Launch with ./run-evidence-100k.sh; it injects the checkout SHA automatically.

services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    command: ["redis-server"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
      - redis-cgroup-evidence:/redis-cgroup
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Partition nodes ──────────────────────────────────────────────────
  nchan-p0:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan.conf"
      CONTROL_PORT: "18888"
      NGINX_STATUS_PORT: "8080"
      MIN_CPU_QUOTA: "3"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p1:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-2.conf"
      CONTROL_PORT: "18889"
      NGINX_STATUS_PORT: "18080"
      MIN_CPU_QUOTA: "3"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p2:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-3.conf"
      CONTROL_PORT: "28888"
      NGINX_STATUS_PORT: "28080"
      MIN_CPU_QUOTA: "3"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:28080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p3:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-4.conf"
      CONTROL_PORT: "38889"
      NGINX_STATUS_PORT: "38080"
      MIN_CPU_QUOTA: "3"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:38080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Spare replacement node (idle standby until failover) ─────────────
  nchan-spare:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-spare.conf"
      CONTROL_PORT: "48888"
      NGINX_STATUS_PORT: "48080"
      MIN_CPU_QUOTA: "3"
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:48080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  coordinator:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    command: ["npm", "run", "start:coordinator"]
    networks:
      - shard-net
    environment:
      SHARD_TOTAL: "4"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      EXPERIMENT_RUN_ID: "${EXPERIMENT_RUN_ID:?Use ./run-evidence-100k.sh}"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_RESULT_PATH: "${GLOBAL_RESULT_PATH:-/evidence/global-result-0.json}"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      COORDINATOR_MAX_RUN_MS: "2100000"
    volumes:
      - global-evidence:/evidence
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  # ── Generator shards: shard i owns partition i ───────────────────────

  runner-shard-0:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:8080"
      NCHAN_SUB_URL: "http://host.docker.internal:8081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:18888"
      NCHAN_SPARE_PUB_URL: "http://host.docker.internal:48080"
      NCHAN_SPARE_SUB_URL: "http://host.docker.internal:48081"
      NCHAN_SPARE_CONTROL_URL: "http://host.docker.internal:48888"
      REDIS_URL: "redis://host.docker.internal:6379"
      TARGET_CONNECTIONS: "25000"
      WARMUP_SECONDS: "30"
      MEASURE_SECONDS: "120"
      BURST_SECONDS: "30"
      SURGE_SECONDS: "120"
      COOLDOWN_SECONDS: "10"
      SLOW_CONSUMER_FRACTION: "0.05"
      RUN_PROFILE: "evidence"
      RUN_MODE: "coordinated-shard"
      COORDINATOR_URL: "http://coordinator:3000"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      GLOBAL_RUN_INDEX: "${GLOBAL_RUN_INDEX:-0}"
      SEED: "${GLOBAL_SEED:-42}"
      PUBLISHER_OWNER: "true"
      SHARD_ID: "0"
      SHARD_TOTAL: "4"
      # §v2.1.0: 1-based restart drill target — shard 4 owns partition p3
      RESTART_TARGET_SHARD: "4"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      # §BS hang-safety ceiling for the coordinated 100k profile: generous, never
      # fires in a valid run; prevents valid phase overruns from destroying evidence
      RUNNER_MAX_RUN_MS: "1800000"
      NCHAN_CPU_MAX_QUOTA: "300000"
      NCHAN_CPU_MAX_PERIOD: "100000"
      REDIS_CPU_MAX_QUOTA: "200000"
      REDIS_CPU_MAX_PERIOD: "100000"
      NCHAN_MEMORY_GB: "6"
      NCHAN_NOFILE_SOFT: "200000"
      NCHAN_NOFILE_HARD: "200000"
      REDIS_MEMORY_GB: "2"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  runner-shard-1:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:18080"
      NCHAN_SUB_URL: "http://host.docker.internal:18081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:18889"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "1"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  runner-shard-2:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:28080"
      NCHAN_SUB_URL: "http://host.docker.internal:28081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:28888"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "2"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  runner-shard-3:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:38080"
      NCHAN_SUB_URL: "http://host.docker.internal:38081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:38889"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "3"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

networks:
  shard-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  global-evidence:
  redis-cgroup-evidence:

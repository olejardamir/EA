# §M3 v2.2.0: Horizontally partitioned 100k fan-out topology (contract v2.2.0).
#
# Architecture: four independent Nchan partition nodes, each serving ~25,000
# viewers of the 100,000-viewer global target, plus one spare replacement node.
# All nodes share one canonical Redis store. One independent publisher/control
# service owns canonical event generation and publishes exactly once via p0.
# Four Go load-generator shards (25k each) own one partition each.
#
# Port allocation (all host networking):
#   node              pub     sub     control
#   nchan-p0          8080    8081    18888
#   nchan-p1          18080   18081   18889
#   nchan-p2          28080   28081   28888
#   nchan-p3          38080   38081   38889
#   nchan-spare       48080   48081   48888
#   publisher-control 8300    —       —
#
# Generator shards: Go lightweight path (25k each) + bounded deep cohort.
# Per-shard source-port range: net.ipv4.ip_local_port_range = "1024 65535"
# (64,512 ports) via namespaced sysctl; headroom proof requires >= 4000 free.
#
# Launch with ./run-evidence-100k.sh; it injects the checkout SHA automatically.

services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    # Ephemeral per-run dataset (FLUSHALL between runs; durability carries no
    # evidence value): disable RDB/AOF so BGSAVE fork stalls on the CPU quota
    # cannot freeze the publication-accept path mid-run.
    # io-threads=4 with writes: redis is the shared publication/interconnect
    # hub and its single main thread saturates one core under the frozen
    # publication rate, spiking accept and cross-partition delivery latency.
    # io-threads=4: redis is the shared publication/interconnect
    # hub and its single main thread saturates one core under the frozen
    # publication rate, spiking accept and cross-partition delivery latency.
    # (io-threads-do-writes is not settable via CLI args in redis 7.2.)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--io-threads", "4"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
      - redis-cgroup-evidence:/redis-cgroup
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    # Redis serializes every publication accept and inter-partition fanout;
    # it must not yield to desktop load during measurement windows.
    cpu_shares: 262144
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan-p0:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan.conf"
      CONTROL_PORT: "18888"
      NGINX_STATUS_PORT: "8080"
      MIN_CPU_QUOTA: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p1:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-2.conf"
      CONTROL_PORT: "18889"
      NGINX_STATUS_PORT: "18080"
      MIN_CPU_QUOTA: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p2:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-3.conf"
      CONTROL_PORT: "28888"
      NGINX_STATUS_PORT: "28080"
      MIN_CPU_QUOTA: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:28080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-p3:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-4.conf"
      CONTROL_PORT: "38889"
      NGINX_STATUS_PORT: "38080"
      MIN_CPU_QUOTA: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:38080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nchan-spare:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NGINX_CONF: "/etc/nginx/nchan-spare.conf"
      CONTROL_PORT: "48888"
      NGINX_STATUS_PORT: "48080"
      MIN_CPU_QUOTA: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:48080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  publisher:
    build:
      context: ./runner
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
      nchan-p0:
        condition: service_healthy
    command: ["npm", "run", "start:publisher"]
    environment:
      PUBLISHER_PORT: "8300"
      NCHAN_PUB_URL: "http://host.docker.internal:8080"
      PUB_DEBUG: "${PUB_DEBUG:-0}"
      REDIS_URL: "redis://host.docker.internal:6379"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Elevated CFS scheduler weight: the publisher's event loop paces the
    # frozen burst-rate workload and must not starve under host contention.
    cpu_shares: 262144
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8300/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  coordinator:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
    command: ["npm", "run", "start:coordinator"]
    networks:
      - shard-net
    environment:
      SHARD_TOTAL: "4"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      EXPERIMENT_RUN_ID: "${EXPERIMENT_RUN_ID:?Use ./run-evidence-100k.sh}"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_RESULT_PATH: "${GLOBAL_RESULT_PATH:-/evidence/global-result-0.json}"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      COORDINATOR_MAX_RUN_MS: "2100000"
    volumes:
      - global-evidence:/evidence
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  loadgen-shard-0:
    build:
      context: ./loadgen
      network: host

    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      publisher:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:8080"
      NCHAN_SUB_URL: "http://host.docker.internal:8081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:18888"
      NCHAN_SPARE_PUB_URL: "http://host.docker.internal:48080"
      NCHAN_SPARE_SUB_URL: "http://host.docker.internal:48081"
      NCHAN_SPARE_CONTROL_URL: "http://host.docker.internal:48888"
      REDIS_ADDR: "host.docker.internal:6379"
      PUBLISHER_URL: "http://host.docker.internal:8300"
      TARGET_CONNECTIONS: "25000"
      WARMUP_SECONDS: "30"
      MEASURE_SECONDS: "120"
      BURST_SECONDS: "30"
      SURGE_SECONDS: "120"
      COOLDOWN_SECONDS: "10"
      RUN_PROFILE: "evidence"
      RUN_MODE: "coordinated-shard"
      COORDINATOR_URL: "http://coordinator:3000"
      CAMPAIGN_ID: "${CAMPAIGN_ID:?Use ./run-evidence-100k.sh}"
      GLOBAL_TARGET: "100000"
      GLOBAL_SEED: "${GLOBAL_SEED:-42}"
      GLOBAL_RUN_INDEX: "${GLOBAL_RUN_INDEX:-0}"
      PUBLISHER_OWNER: "true"
      SHARD_ID: "0"
      SHARD_TOTAL: "4"
      RESTART_TARGET_SHARD: "4"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-evidence-100k.sh}"
      # Align the Go runtime with the container CPU quota: GOMAXPROCS defaulting
      # to host core count makes the scheduler overshoot the quota on every GC
      # cycle and trip the frozen generator throttle/CPU-peak gates.
      GOMAXPROCS: "4"
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 4G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  loadgen-shard-1:
    build:
      context: ./loadgen
      network: host

    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      publisher:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:18080"
      NCHAN_SUB_URL: "http://host.docker.internal:18081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:18889"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "1"
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 4G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  loadgen-shard-2:
    build:
      context: ./loadgen
      network: host

    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      publisher:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:28080"
      NCHAN_SUB_URL: "http://host.docker.internal:28081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:28888"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "2"
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 4G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

  loadgen-shard-3:
    build:
      context: ./loadgen
      network: host

    depends_on:
      nchan-p0:
        condition: service_healthy
      nchan-p1:
        condition: service_healthy
      nchan-p2:
        condition: service_healthy
      nchan-p3:
        condition: service_healthy
      nchan-spare:
        condition: service_healthy
      publisher:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    networks:
      - shard-net
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *runner-env
      NCHAN_PUB_URL: "http://host.docker.internal:38080"
      NCHAN_SUB_URL: "http://host.docker.internal:38081"
      NCHAN_CONTROL_URL: "http://host.docker.internal:38889"
      PUBLISHER_OWNER: "false"
      SHARD_ID: "3"
    deploy:
      resources:
        limits:
          cpus: "5"
          memory: 4G
    cpu_shares: 262144
    ulimits:
      nofile:
        soft: 120000
        hard: 120000

networks:
  shard-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  global-evidence:
  redis-cgroup-evidence:

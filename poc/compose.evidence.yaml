services:
  redis:
    image: redis:7.2-bookworm
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan:
    image: poc-nchan:latest
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    image: poc-runner:latest
    network_mode: host
    depends_on:
      nchan:
        condition: service_healthy
    environment:
      NCHAN_PUB_URL: "http://localhost:8080"
      NCHAN_SUB_URL: "http://localhost:8081"
      REDIS_URL: "redis://localhost:6379"
      WORKER_COUNT: "4"
      TARGET_CONNECTIONS: "10000"
      WARMUP_SECONDS: "30"
      MEASURE_SECONDS: "120"
      BURST_SECONDS: "30"
      COOLDOWN_SECONDS: "10"
      SLOW_SECONDS: "15"
      RUN_PROFILE: "evidence"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

# Non-qualifying development probe overrides for the partitioned 100k topology
# (contract v2.2.0 §Qualification discipline). This file NEVER participates in
# a qualifying campaign: qualifying runs use ./run-evidence-100k.sh alone.
#
# Usage (10k example):
#   PROBE_TARGET=2500 PROBE_GLOBAL_TARGET=10000 \
#   GIT_COMMIT_SHA=$(git rev-parse HEAD) CAMPAIGN_ID=probe-10k-$(date +%s) \
#   EXPERIMENT_RUN_ID=probe-10k-run0 \
#   docker compose -f compose.evidence-100k.yaml -f compose.probe.yaml \
#     up --build --force-recreate --abort-on-container-exit --exit-code-from coordinator
#
# Supports both the legacy TS runner shards (pre-v2.2.0) and the current
# Go loadgen shards (v2.2.0 qualifying path).
services:
  coordinator:
    environment:
      GLOBAL_TARGET: "${PROBE_GLOBAL_TARGET:?set PROBE_GLOBAL_TARGET}"

  loadgen-shard-0:
    environment:
      GLOBAL_TARGET: "${PROBE_GLOBAL_TARGET:?set PROBE_GLOBAL_TARGET}"
      TARGET_CONNECTIONS: "${PROBE_TARGET:?set PROBE_TARGET}"
      WARMUP_SECONDS: "${PROBE_WARMUP_SECONDS:-15}"
      MEASURE_SECONDS: "${PROBE_MEASURE_SECONDS:-30}"
      BURST_SECONDS: "${PROBE_BURST_SECONDS:-10}"
      SURGE_SECONDS: "${PROBE_SURGE_SECONDS:-60}"
      COOLDOWN_SECONDS: "${PROBE_COOLDOWN_SECONDS:-5}"

  loadgen-shard-1:
    environment:
      GLOBAL_TARGET: "${PROBE_GLOBAL_TARGET:?set PROBE_GLOBAL_TARGET}"
      TARGET_CONNECTIONS: "${PROBE_TARGET:?set PROBE_TARGET}"
      WARMUP_SECONDS: "${PROBE_WARMUP_SECONDS:-15}"
      MEASURE_SECONDS: "${PROBE_MEASURE_SECONDS:-30}"
      BURST_SECONDS: "${PROBE_BURST_SECONDS:-10}"
      SURGE_SECONDS: "${PROBE_SURGE_SECONDS:-60}"
      COOLDOWN_SECONDS: "${PROBE_COOLDOWN_SECONDS:-5}"

  loadgen-shard-2:
    environment:
      GLOBAL_TARGET: "${PROBE_GLOBAL_TARGET:?set PROBE_GLOBAL_TARGET}"
      TARGET_CONNECTIONS: "${PROBE_TARGET:?set PROBE_TARGET}"
      WARMUP_SECONDS: "${PROBE_WARMUP_SECONDS:-15}"
      MEASURE_SECONDS: "${PROBE_MEASURE_SECONDS:-30}"
      BURST_SECONDS: "${PROBE_BURST_SECONDS:-10}"
      SURGE_SECONDS: "${PROBE_SURGE_SECONDS:-60}"
      COOLDOWN_SECONDS: "${PROBE_COOLDOWN_SECONDS:-5}"

  loadgen-shard-3:
    environment:
      GLOBAL_TARGET: "${PROBE_GLOBAL_TARGET:?set PROBE_GLOBAL_TARGET}"
      TARGET_CONNECTIONS: "${PROBE_TARGET:?set PROBE_TARGET}"
      WARMUP_SECONDS: "${PROBE_WARMUP_SECONDS:-15}"
      MEASURE_SECONDS: "${PROBE_MEASURE_SECONDS:-30}"
      BURST_SECONDS: "${PROBE_BURST_SECONDS:-10}"
      SURGE_SECONDS: "${PROBE_SURGE_SECONDS:-60}"
      COOLDOWN_SECONDS: "${PROBE_COOLDOWN_SECONDS:-5}"

# TEMP-DIAG (run T experiment): the auto-gdb livelock watcher attaches to and
# STOPS nginx workers mid-run — 39 backtrace dumps landed in run S, each one
# pausing exactly the worker whose delivery queue was already deepest. The
# standalone fan-out microbenchmark delivers 12M frames with p95 ~1s on the
# same node image when nothing ptraces it, so diagnostic interference is now
# the leading amplifier of the target-era stall. Disabled here; the base
# stall (if any remains) is still measurable via stub-status + wchar timeline.
  nchan-p0:
    environment:
      LIVELOCK_WATCHER: "0"
  nchan-p1:
    environment:
      LIVELOCK_WATCHER: "0"
  nchan-p2:
    environment:
      LIVELOCK_WATCHER: "0"
  nchan-p3:
    environment:
      LIVELOCK_WATCHER: "0"
  nchan-spare:
    environment:
      LIVELOCK_WATCHER: "0"

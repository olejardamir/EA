# §6.16: Portable smoke profile for Docker Desktop (Mac/Windows).
# Uses bridge networking with explicit port mappings instead of network_mode: host.
# Requires nchan-portable.conf which binds publisher/subscriber ports to 0.0.0.0
# and resolves Redis via Docker service name "redis" instead of 127.0.0.1.
#
# Usage:
#   docker compose -f compose.smoke-portable.yaml up --build --abort-on-container-exit
#
# Port mappings:
#   redis:6379 (host) -> redis:6379 (container)
#   nchan:8080 (host) -> nchan:8080 (container) — publisher
#   nchan:8081 (host) -> nchan:8081 (container) — subscriber

services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan:
    build:
      context: ./nchan
    # §6.16: Override default nchan.conf with portable config that uses
    # Docker service name "redis" for cross-container connectivity.
    environment:
      NGINX_CONF: "/etc/nginx/nchan-portable.conf"
      CONTROL_PORT: "18888"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "18888:18888"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    build:
      context: ./runner
    depends_on:
      nchan:
        condition: service_healthy
    environment:
      # §3.20: Use Compose service DNS for inter-container connectivity.
      # Works on Linux Docker Engine without host.docker.internal support.
      NCHAN_PUB_URL: "http://nchan:8080"
      NCHAN_SUB_URL: "http://nchan:8081"
      NCHAN_CONTROL_URL: "http://nchan:18888"
      REDIS_URL: "redis://redis:6379"
      TARGET_CONNECTIONS: "100"
      WARMUP_SECONDS: "5"
      MEASURE_SECONDS: "10"
      BURST_SECONDS: "5"
      COOLDOWN_SECONDS: "3"
      SLOW_CONSUMER_FRACTION: "0.05"
      RUN_PROFILE: "smoke"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

# Launch with ./run-smoke.sh; it injects the checkout SHA automatically.
services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    command: ["redis-server"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
      - redis-cgroup-evidence:/redis-cgroup
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CONTROL_PORT: "18888"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    build:
      context: ./runner
      network: host
      args:
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-smoke.sh}"
    network_mode: host
    volumes:
      - redis-cgroup-evidence:/redis-cgroup:ro
    depends_on:
      nchan:
        condition: service_healthy
    environment:
      NCHAN_PUB_URL: "http://localhost:8080"
      NCHAN_SUB_URL: "http://localhost:8081"
      NCHAN_CONTROL_URL: "http://localhost:18888"
      REDIS_URL: "redis://localhost:6379"
      TARGET_CONNECTIONS: "100"
      WARMUP_SECONDS: "5"
      MEASURE_SECONDS: "10"
      BURST_SECONDS: "5"
      SURGE_SECONDS: "5"
      COOLDOWN_SECONDS: "3"
      SLOW_CONSUMER_FRACTION: "0.05"
      RUN_PROFILE: "smoke"
      RUN_MODE: "single"
      # §3.15: Source commit identity — passed from host since .git is not copied into the image
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:?Use ./run-smoke.sh}"
      # §3.8.A: Per-service CPU limits for normalized CPU metrics
      NCHAN_CPU_MAX_QUOTA: "400000"
      REDIS_CPU_MAX_QUOTA: "200000"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

volumes:
  redis-cgroup-evidence:

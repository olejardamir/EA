# Final submission POC — one-command portable fan-out measurement.
# Runs from an extracted submission ZIP root with only Docker/Docker Compose.
# Builds Redis, Nchan (nginx + nchan module), and the TS runner; simulates eight
# live matches; steps real SSE subscriber load at 100 / 500 / 1000; measures
# fan-out latency and delivery correctness; reports COMPLETED.
services:
  redis:
    image: redis:7.2-bookworm@sha256:6461ca4ac0c5c9d81d53685c3bf76aa81f464a9de6cf3a97b80a1da8d1bb1de4
    network_mode: host
    entrypoint: ["/bin/sh", "/redis-cgroup-entrypoint.sh"]
    command: ["redis-server"]
    volumes:
      - ./redis-cgroup-entrypoint.sh:/redis-cgroup-entrypoint.sh:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nchan:
    build:
      context: ./nchan
      network: host
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CONTROL_PORT: "18888"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/pub/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    build:
      context: ./runner
      network: host
    network_mode: host
    depends_on:
      nchan:
        condition: service_healthy
    environment:
      NCHAN_PUB_URL: "http://localhost:8080"
      NCHAN_SUB_URL: "http://localhost:8081"
      NCHAN_CONTROL_URL: "http://localhost:18888"
      REDIS_URL: "redis://localhost:6379"
      STEP_CONNECTIONS: "100,500,1000"
      WARMUP_SECONDS: "5"
      MEASURE_SECONDS: "25"
      BURST_SECONDS: "5"
      SURGE_SECONDS: "5"
      COOLDOWN_SECONDS: "3"
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    ulimits:
      nofile:
        soft: 100000
        hard: 100000


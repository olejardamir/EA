# §6.16: Portable Nchan configuration for bridge networking (Docker Desktop).
# Uses Docker service name "redis" for cross-container connectivity instead of 127.0.0.1.
# Binds to 0.0.0.0 so published ports are accessible via Docker port mappings.
#
# This config mirrors nchan.conf exactly except for:
#   1. Redis upstream: "redis" service name instead of 127.0.0.1
#   2. Listen directives: 0.0.0.0:port instead of port-only (for port mapping)
#
# Usage: docker compose -f compose.smoke-portable.yaml up --build

# §BC: Match container 4-CPU budget (compose cpus: "4")
worker_processes 4;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stderr main;

    upstream redis_backend {
        # §6.16: Use Docker service name "redis" for bridge networking.
        # In bridge mode, containers resolve each other via service names.
        nchan_redis_server redis:6379;
        nchan_redis_connect_timeout 5s;
        nchan_redis_command_timeout 5s;
    }

    nchan_shared_memory_size 64m;

    # Publisher server (port 8080)
    server {
        # §6.16: Bind to 0.0.0.0 for Docker port mapping accessibility.
        listen 0.0.0.0:8080;

        location = /pub/healthcheck {
            return 200 'ok';
        }

        # §6.33: Explicit lobby publisher with buffer_length=1.
        location = /pub/lobby {
            nchan_publisher;
            nchan_channel_id "lobby";
            nchan_message_timeout 2h;
            nchan_message_buffer_length 1;
            nchan_redis_pass redis_backend;
        }

        location ~ ^/pub/(.+)$ {
            nchan_publisher;
            nchan_channel_id $1;
            nchan_message_timeout 2h;
            # §C: 5,000-message buffer is a POC constraint for late-join history.
            nchan_message_buffer_length 5000;
            nchan_redis_pass redis_backend;
        }
    }

    # Subscriber server (port 8081)
    server {
        # §6.16: Bind to 0.0.0.0 for Docker port mapping accessibility.
        listen 0.0.0.0:8081;

        # Live subscriber (newest only)
        location ~ ^/sub/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message newest;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_redis_pass redis_backend;
        }

        # Late-join / history replay subscriber (oldest)
        location ~ ^/history/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message oldest;
            nchan_eventsource_event "update";
            nchan_redis_pass redis_backend;
        }

        # Lobby
        # §B: oldest sends buffered state immediately on connect.
        location = /sub/lobby {
            nchan_subscriber eventsource;
            nchan_channel_id "lobby";
            nchan_subscriber_first_message oldest;
            nchan_message_buffer_length 1;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_eventsource_event "lobby";
            nchan_redis_pass redis_backend;
        }
    }
}

# §M3-R: Spare replacement node of the horizontally partitioned fan-out
# topology (contract v2.1.0). Stands by idle during normal operation; receives
# one partition's drained viewers during the partition-targeted restart
# scenario, serving them live plus Last-Event-ID exact-range replay while
# their home partition recovers.
# Port allocation: publisher/status 48080, subscriber 48081, control 48888.
# Shares the single canonical Redis store with every partition node.

# Matches container CPU budget (compose cpus: "3")
worker_processes 4;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
    # multi_accept off: with on, one worker swallows entire dial waves (24.8k of 25k
    # subscriber sockets on a single worker), capping per-node fan-out at one core
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    # §4.21: Disable per-client/per-event access logging at evidence scale
    access_log off;

    upstream redis_backend {
        nchan_redis_server 127.0.0.1:6379;
        nchan_redis_connect_timeout 5s;
        nchan_redis_command_timeout 60s;
        nchan_redis_storage_mode backup;
    }

    nchan_shared_memory_size 64m;

    # Publisher server (port 48080)
    server {
        listen 48080;

        location = /pub/healthcheck {
            return 200 'ok';
        }

        # §4.24: Runtime nginx capacity preflight — expose worker status
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # §6.33: Explicit lobby publisher with buffer_length=1.
        location = /pub/lobby {
            nchan_publisher;
            nchan_channel_id "lobby";
            nchan_message_timeout 2h;
            nchan_message_buffer_length 1;
            nchan_redis_pass redis_backend;
        }

        location ~ ^/pub/(.+)$ {
            nchan_publisher;
            nchan_channel_id $1;
            nchan_message_timeout 2h;
            nchan_message_buffer_length 5000;
            nchan_redis_pass redis_backend;
        }
    }

    # Subscriber server (port 48081)
    server {
        listen 48081 reuseport;

        # Live subscriber (newest only)
        # TEMP-DIAG: fan-out queue visibility during burst/drill stalls
        location = /nchan_stub_status {
            nchan_stub_status;
            allow all;
        }

        location ~ ^/sub/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message newest;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_redis_pass redis_backend;
        }

        # Late-join / history replay subscriber (oldest)
        location ~ ^/history/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message oldest;
            nchan_eventsource_event "update";
            nchan_redis_pass redis_backend;
        }

        # Lobby
        # §B: oldest sends buffered state immediately on connect.
        location = /sub/lobby {
            nchan_subscriber eventsource;
            nchan_channel_id "lobby";
            nchan_subscriber_first_message oldest;
            nchan_message_buffer_length 1;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_eventsource_event "lobby";
            nchan_redis_pass redis_backend;
        }
    }
}

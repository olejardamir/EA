# §BC: Match container 4-CPU budget (compose cpus: "4")
worker_processes 4;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
    # multi_accept off: with on, one worker swallows entire dial waves (24.8k of 25k
    # subscriber sockets on a single worker), capping per-node fan-out at one core
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # §M3: cap per-event-loop output chain so a worker yields between
    # subscribers instead of draining one subscriber's multi-MB SSE spool in a
    # single monopolizing writev (root-cause signature: writev drain of 2MB
    # buffered chains stalls fan-out delivery in the target/burst era).
    sendfile_max_chunk 64k;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    # §4.21: Disable per-client/per-event access logging at evidence scale
    access_log off;

    upstream redis_backend {
        nchan_redis_server 127.0.0.1:6379;
        nchan_redis_connect_timeout 5s;
        nchan_redis_command_timeout 60s;
    }

    nchan_shared_memory_size 64m;

    # Publisher server (port 8080)
    server {
        listen 8080;

        location = /pub/healthcheck {
            return 200 'ok';
        }

        # §4.24: Runtime nginx capacity preflight — expose worker status
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # §6.33: Explicit lobby publisher with buffer_length=1.
        # The generic /pub/(.+) location sets buffer=5000 for match channels.
        # Without this override, publishing to /pub/lobby would use buffer=5000,
        # defeating the lobby's intended latest-state-only semantics.
        # Nginx exact location (=) takes priority over regex (~) location.
        location = /pub/lobby {
            nchan_publisher;
            nchan_channel_id "lobby";
            nchan_message_timeout 2h;
            nchan_message_buffer_length 1;
            nchan_redis_pass redis_backend;
        }

        location ~ ^/pub/(.+)$ {
            nchan_publisher;
            nchan_channel_id $1;
            nchan_message_timeout 2h;
            # §C: 5,000-message buffer is a POC constraint for late-join history.
            # Production would use message_timeout=0 (infinite buffer) during active match.
            # With ~9 events/s steady rate, 5,000 messages ≈ 9 minutes of history.
            nchan_message_buffer_length 5000;
            nchan_redis_pass redis_backend;
        }
    }

    # Subscriber server (port 8081)
    server {
        listen 8081 reuseport;
        # Live subscriber (newest only)
        # nchan_eventsource_event REMOVED: per-message X-Event-Source-Event
        # header forwarded to subscribers as-is for per-message event types.
        # Source: Nchan 1.3.8 docs — nchan_eventsource_event overrides
        # the per-message header, defeating per-message event type scheme.
        # §B: nchan_subscriber_first_message newest means "wait for the next
        # message" per Nchan docs. This is intentional for live subscribers —
        # they receive only new events, not buffered history. History replay
        # uses the /history/ endpoint with 'oldest' instead.
        # TEMP-DIAG: fan-out queue visibility during burst/drill stalls
        location = /nchan_stub_status {
            nchan_stub_status;
            allow all;
        }

        location ~ ^/sub/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message newest;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_redis_pass redis_backend;
        }

        # Late-join / history replay subscriber (oldest)
        location ~ ^/history/(.+)$ {
            nchan_subscriber eventsource;
            nchan_channel_id $1;
            nchan_subscriber_first_message oldest;
            nchan_eventsource_event "update";
            nchan_redis_pass redis_backend;
        }

        # Lobby
        # §B: nchan_subscriber_first_message oldest sends the oldest buffered
        # message immediately on connect (Nchan docs: "starts at the oldest
        # available message in a channel's message queue"). With buffer=1,
        # this means the latest lobby state is delivered on connect, then
        # live updates follow. 'newest' would WAIT for the next message,
        # which would NOT send the current buffered state immediately.
        location = /sub/lobby {
            nchan_subscriber eventsource;
            nchan_channel_id "lobby";
            nchan_subscriber_first_message oldest;
            nchan_message_buffer_length 1;
            nchan_eventsource_ping_interval 15;
            nchan_eventsource_ping_comment "keepalive";
            nchan_eventsource_ping_data "";
            nchan_eventsource_event "lobby";
            nchan_redis_pass redis_backend;
        }
    }
}
